name: eject
services:
    demo-db-d9833907393663d2:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: eject
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set locally}
            POSTGRES_USER: eject
        networks:
            - eject
        volumes:
            - demo-db-d9833907393663d2-data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U eject -d eject
            interval: 10s
            timeout: 5s
            retries: 5
networks:
    eject:
        driver: bridge
volumes:
    demo-db-d9833907393663d2-data: {}
